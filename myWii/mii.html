 $('#wq').onclick=()=>{const d=document.createElement('div');d.className='wmo';d.innerHTML=`<div class='wbx2'><div class='wtl'>Enregistrer ce Mii ?</div><button class='wb' data-q='s'>Enregistrer</button><button class='wb' data-q='n'>Ne pas enregistrer</button><button class='wb' data-q='c'>Annuler</button></div>`;view.appendChild(d);d.onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q;if(q=='c'){d.remove();return}document.removeEventListener('pointerup',stop);if(q=='s'){w.name=(w.name||'Mii').trim()||'Mii';const m=mkMii({...w},base&&base.id),i=miis.findIndex(x=>x.id===m.id);if(i>=0)miis[i]=m;else miis.push(m);save()}go('plaza')}};
 $('#wrd').onclick=()=>{const keep={name:w.name,gender:w.gender,favorite:w.favorite,bm:w.bm,bd:w.bd,creator:w.creator};delete w.skc;Object.assign(w,rndWii(),keep);pgs={};rt();rp();draw()};
 rt();rp();draw();
}
/* --- étapes avant l'éditeur --- */
function studio(id){
 const base=id&&miis.find(m=>m.id===id);
 if(base&&base.wf)return editor({...DEF,...base.wf},base);
 $('#app').classList.add('fs');
 view.innerHTML=`<div class='ws2'><div class='wtl'>Comment voulez-vous<br>créer un Mii ?</div><button class='wb big' style='padding:3vh 20px' data-m='o'>Créer un Mii original</button><button class='wb big' style='padding:3vh 20px' data-m='l'>Choisir un visage<br>ressemblant</button><button class='wb big' style='padding:3vh 20px' data-m='r'>🎲 Mii aléatoire</button><button class='wb back' data-m='b'>Retour</button></div>`;
 view.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;if(m=='b')return go('plaza');if(m=='r')return editor(rndWii());sexe(m)};
}
function sexe(mode){
 view.innerHTML=`<div class='ws2'><div class='wtl'>Choisissez un sexe.</div><div class='wsx'><button class='wb big' data-g='0'><svg viewBox='0 0 40 80' height='150' fill='#3a6cf0'><circle cx='20' cy='12' r='11'/><rect x='6' y='26' width='28' height='54' rx='10'/></svg><span>Homme</span></button><button class='wb big' data-g='1'><svg viewBox='0 0 40 80' height='150' fill='#f05a5a'><circle cx='20' cy='12' r='11'/><path d='M8 26h24l6 30H2z'/><rect x='10' y='54' width='8' height='26' rx='4'/><rect x='22' y='54' width='8' height='26' rx='4'/></svg><span>Femme</span></button></div><button class='wb back' data-g='x'>Annuler</button></div>`;
 view.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;if(b.dataset.g=='x')return go('plaza');const g=+b.dataset.g;if(mode=='o')editor({...DEF,gender:g,name:'Mon Mii'});else ressemblant(g)};
}
function ressemblant(g){
 const L=Array.from({length:12},()=>({...rndWii(),gender:g,name:'Mon Mii'}));
 view.innerHTML=`<div class='ws2'><div class='wtl'>Choisissez un visage ressemblant.</div><div class='wlk'>${L.map((x,i)=>`<button class='wti' data-l='${i}'><img alt='' data-l2='${i}'></button>`).join('')}</div><button class='wb back' data-l='x'>Retour</button></div>`;
 L.forEach((x,i)=>paint(view.querySelector(`[data-l2='${i}']`),x,'face',160));
 view.onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;if(b.dataset.l=='x')return sexe('l');editor(L[+b.dataset.l])};
}
/* --- mes Miis --- */
function liste(){
 view.innerHTML=`<div id='ls'><div class='tools'><button id='ex'>Exporter</button><button id='im'>Importer</button><input type='file' id='fi' accept='.json' hidden></div>${miis.map(d=>`<div class='cd'><div class='f'>${mii(d)}</div><b>${d.n}</b>${d.wf?`<button data-a='e' data-i='${d.id}'>Modifier</button>`:''}<button data-a='c' data-i='${d.id}'>Copier</button><button class='rm' data-a='d' data-i='${d.id}'>Supprimer</button></div>`).join('')}<button class='add' id='ad' aria-label='Nouveau Mii'>+</button></div>`;
 $('#ad').onclick=()=>go('studio');
 /* visage de secours dessiné localement si l'image Mii Studio ne charge pas */
const fbFace=(sk,hc)=>`<svg class='m' viewBox='0 0 100 100'><ellipse cx='50' cy='54' rx='30' ry='34' fill='${sk}'/><path d='M19 50Q20 14 50 14Q80 14 81 50Q70 32 50 32Q30 32 19 50z' fill='${hc}'/><circle cx='39' cy='56' r='3.5' fill='#222'/><circle cx='61' cy='56' r='3.5' fill='#222'/><path d='M42 70Q50 76 58 70' stroke='#7a2630' stroke-width='3' fill='none' stroke-linecap='round'/></svg>`;
 miis.forEach(d=>{const im=view.querySelector(`img[data-id='${d.id}']`);if(!im)return;
  const sk=d.skc||(d.wf?WPAL.skin[d.wf.fc%WPAL.skin.length]:'#e8b07c'),hc=d.wf?WPAL.hair[d.wf.hc%WPAL.hair.length]:'#3a2a1f';
  let tries=0;im.onerror=()=>{if(tries++<1){im.src=im.src+'&r=1';return}const t=document.createElement('template');t.innerHTML=fbFace(sk,hc).trim();im.replaceWith(t.content.firstChild)};
  if(d.skc&&d.wf)paint(im,wOf(d),'face',256)});
 $('#ls').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=miis.findIndex(m=>m.id===b.dataset.i),a=b.dataset.a;if(a=='e')go('studio',b.dataset.i);else if(a=='c'){miis.push({...miis[i],id:Date.now()+'-'+R(1e6),n:miis[i].n+' 2'});save();liste()}else if(confirm('Supprimer '+miis[i].n+' ?')){miis.splice(i,1);save();liste()}};
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(miis)],{type:'application/json'}));a.download='miis.json';a.click()};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const a=JSON.parse(t);if(Array.isArray(a)){a.forEach(m=>{if(m&&m.n&&m.hs!==undefined)miis.push({...rnd(),...m,id:Date.now()+'-'+R(1e6)})});save();liste()}}catch(x){alert('Fichier invalide')}})};
}
/* --- import d'un Mii Wii (74 octets) -> rendu officiel Mii Studio --- */
const hex2b=t=>{t=t.replace(/[^0-9a-f]/gi,'');if(t.length<148)return null;const b=new Uint8Array(74);for(let i=0;i<74;i++)b[i]=parseInt(t.substr(i*2,2),16);return b};
function wiimii(){
 view.innerHTML=`<div id='st'><div class='ed'><div class='lb'>Colle les 74 octets de ton Mii Wii (148 caractères hexadécimaux) ou charge un fichier .mii. Le rendu officiel vient de Mii Studio (internet requis).</div><textarea id='hx' placeholder='03420220a461b2c4…'></textarea><div class='bt'><button id='lf'>Charger un fichier…</button><button id='dc' class='pri'>Décoder</button></div><input type='file' id='mf' hidden></div><div class='pv'><div id='big'><img id='pr' alt='Aperçu' hidden></div><div class='bt'><button id='tf'>Visage</button><button id='tb'>Corps</button></div><div id='inf' class='lb'>Aucun Mii décodé</div><button id='sv' class='pri' disabled style='padding:11px;border-radius:14px;width:100%'>Ajouter à mes Miis</button></div></div>`;
 let d=null,ty='face';
 const img=()=>{if(!d)return;const im=$('#pr');$('#inf').textContent=d.n+' — chargement…';im.onload=()=>{im.hidden=false;$('#inf').textContent=d.n};im.onerror=()=>{im.hidden=true;$('#inf').textContent=d.n+' (rendu Studio indisponible : internet ?)'};im.src=STU(d.sd,ty)};
 const show=b=>{d=mkMii(parseWii(b));$('#sv').disabled=false;img()};
 $('#dc').onclick=()=>{const b=hex2b($('#hx').value);if(b)show(b);else $('#inf').textContent='Il faut au moins 148 caractères hexadécimaux'};
 $('#tf').onclick=()=>{ty='face';img()};$('#tb').onclick=()=>{ty='all_body';img()};
 $('#lf').onclick=()=>$('#mf').click();
 $('#mf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(ab=>{if(ab.byteLength<74){$('#inf').textContent='Fichier trop court (74 octets minimum)';return}const b=new Uint8Array(ab,0,74);$('#hx').value=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');show(b)})};
 $('#sv').onclick=()=>{if(d){miis.push(d);save();go('liste')}};
}
go('plaza');
</script></body></html>
