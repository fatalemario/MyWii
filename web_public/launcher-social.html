<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyWii — Amis et salons</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;font:15px Segoe UI,system-ui;background:linear-gradient(145deg,#e9f7fc,#f8fbff);color:#43596a}h1{margin:0 0 5px;color:#278db8}p{color:#78909d}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,button{border:0;border-radius:13px;padding:10px 15px;background:#dff2fa;color:#286b89;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#35b8e8;color:white}.layout{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px}.card{background:#ffffffd9;border:1px solid #d4eaf3;border-radius:18px;padding:16px;box-shadow:0 8px 24px #4c91aa13}.row{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #e7f0f4}.row:last-child{border:0}.row span{flex:1}.row small{display:block;color:#78909d}.messages{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}.bubble{background:#e8f7fc;padding:9px 12px;border-radius:13px;max-width:85%;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#d9efff}.form{display:flex;gap:8px;margin-top:10px}.form input,input{min-width:0;flex:1;border:1px solid #d5e9f1;border-radius:11px;padding:11px;background:white}h2{font-size:17px;margin:0 0 12px}.hint{font-size:13px;color:#8095a0}.hide{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}.messages{height:240px}}</style></head><body><h1>MyWii — Communauté</h1><p>Retrouve tes amis et tes sessions de jeu depuis le launcher Wii.</p><div class="tabs"><button id="friendsTab">Amis</button><button id="roomsTab">Salons</button></div><div id="status" class="hint">Connexion à MyWii…</div><section id="loginBox" class="card hide" style="max-width:460px;margin:14px 0"><h2>Connexion MyWii</h2><p class="hint">Connecte-toi dans le launcher pour retrouver tes amis et tes salons.</p><form id="loginForm" class="form" style="flex-direction:column"><input id="loginEmail" type="email" placeholder="Adresse e-mail" required><input id="loginPassword" type="password" placeholder="Mot de passe" required><button class="primary">Se connecter</button></form></section><div id="socialApp" class="layout"><section class="card"><h2 id="listTitle">Mes amis</h2><form id="addFriend" class="form"><input id="friendName" placeholder="Pseudo MyWii"><button class="primary">Ajouter</button></form><form id="joinRoom" class="form hide"><input id="inviteCode" placeholder="Code du salon"><button class="primary">Rejoindre</button></form><div id="list"></div><button id="createRoom" class="primary hide" style="margin-top:12px">＋ Créer un salon</button></section><section class="card"><h2 id="chatTitle">Messages</h2><div id="messages" class="messages"><p class="hint">Sélectionne un ami ou un salon.</p></div><form id="sendMessage" class="form"><input id="message" placeholder="Écrire un message…" disabled><button class="primary" disabled>Envoyer</button></form></section></div><script type="module" src="/launcher-social.js"></script></body></html>
